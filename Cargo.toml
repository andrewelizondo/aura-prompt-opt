[package]
name = "aura-prompt-opt"
version = "0.1.0"
edition = "2021"
description = "DSPy-style prompt optimizer for Aura TOML agent configurations"
license = "Apache-2.0"
repository = "https://github.com/andrewelizondo/aura-prompt-opt"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
