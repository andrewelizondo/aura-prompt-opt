# Sample Aura config for optimization.
# This is the BEFORE state — aura-prompt-opt will optimize this.

[llm]
provider = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
model = "gpt-4o"

[mcp]
sanitize_schemas = true

[mcp.servers.kubernetes]
transport = "http_streamable"
url = "http://localhost:8081/mcp"
description = "Kubernetes cluster operations: pods, deployments, services, logs"

[mcp.servers.prometheus]
transport = "http_streamable"
url = "http://localhost:8082/mcp"
description = "Prometheus metrics queries and alert status"

[agent]
name = "Kubernetes SRE Agent"
system_prompt = """
You are an SRE agent. Help with incidents.
"""
turn_depth = 20
